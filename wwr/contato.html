<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>White Water Rafting | Fale Conosco</title>

    <meta name="description"
      content="Entre em contato com a White Water Rafting para informações sobre passeios, reservas e aventuras de rafting.">

    <meta name="author" content="Leila Zilene">

    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header id="area-navegacao">

        <img src="imagens/logo.png" alt="Logotipo da White Water Rafting">

        <nav id="links-navegacao">
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>

    </header>


    <main>

        <section class="contato-info">

            <h1>Companhia de Rafting em Corredeiras</h1>

            <p>123 Rua Principal do Rio</p>
            <p>Guarujá, São Paulo</p>
            <p>+55 13 99999-9999</p>
            <p>info@correiras.com</p>

        </section>


        <section class="contato-area">

            <div class="mapa">

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d116677.25907166958!2d-46.3070287005573!3d-23.954627964101057!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94d1fe0bcb5eefe3%3A0xd3ce231a2f8a0536!2sGuaruj%C3%A1%20-%20SP!5e0!3m2!1spt-BR!2sbr!4v1790904677280!5m2!1spt-BR!2sbr"
                  width="600" height="450" allowfullscreen loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </div>


            <form action="#" method="post">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>


                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>


                <fieldset>

                    <legend>Propósito da Mensagem</legend>

                    <input type="radio" id="duvida" name="proposito" value="duvida">
                    <label for="duvida">Dúvida Geral</label>

                    <input type="radio" id="reserva" name="proposito" value="reserva">
                    <label for="reserva">Pergunta sobre Reserva</label>

                    <input type="radio" id="sugestao" name="proposito" value="sugestao">
                    <label for="sugestao">Sugestão</label>

                </fieldset>


                <label for="mensagem">Mensagem:</label>

                <textarea id="mensagem" name="mensagem" rows="5"
                  placeholder="Digite aqui"></textarea>


                <input type="checkbox" id="newsletter" name="newsletter">

                <label for="newsletter">
                    Por favor, me inscreva na newsletter mensal
                </label>


                <button type="submit">Entrar em Contato!</button>

            </form>

        </section>


        <section class="equipe">

            <h2>Estamos Aqui para Servi-lo</h2>

            <div class="funcionarios">

                <figure>
                    <img src="imagens/funcionario1.jpg" alt="Funcionário da equipe de rafting">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>

                <figure>
                    <img src="imagens/funcionario2.jpg" alt="Funcionário da equipe de rafting">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>

                <figure>
                    <img src="imagens/funcionario3.jpg" alt="Funcionário da equipe de rafting">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>

            </div>

        </section>

    </main>


    <footer>

        <p>©2026 Rafting Top Leila Zilene</p>

        <nav class="redes-sociais">

            <a href="https://facebook.com" target="_blank">
                <img src="imagens/facebook_408745.png" alt="Ícone do Facebook">
            </a>

            <a href="https://twitter.com" target="_blank">
                <img src="imagens/twiter.png" alt="Ícone do Twitter">
            </a>

            <a href="https://instagram.com" target="_blank">
                <img src="imagens/insta.jpg" alt="Ícone do Instagram">
            </a>

        </nav>

    </footer>

</body>

</html>
